name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish"
        required: true
        type: string
      expected_sha:
        description: "Exact 40-character release source commit SHA"
        required: true
        type: string

permissions: read-all

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      EXPECTED_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_sha || github.sha }}
    steps:
      - name: Check out exact release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Require public repository and exact release source
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.event.repository.private }}" = "false"
          [[ "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "${EXPECTED_SHA}" =~ ^[0-9a-f]{40}$ ]]
          actual="$(tr -d '\r\n' < VERSION)"
          test "${RELEASE_TAG}" = "v${actual}"
          git fetch origin main
          test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"
          test "$(git rev-list -n1 "${RELEASE_TAG}")" = "${EXPECTED_SHA}"
          if [ "${{ github.event_name }}" = "push" ]; then
            test "${EXPECTED_SHA}" = "$(git rev-parse origin/main)"
          else
            git merge-base --is-ancestor "${EXPECTED_SHA}" origin/main
          fi

      - name: Run release checks
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          bash -n install.sh src/ultimate-updater-notify tests/run.sh
          shellcheck install.sh src/ultimate-updater-notify tests/run.sh
          bash tests/run.sh
          sudo install -D -m 0755 src/ultimate-updater-notify /usr/local/libexec/ultimate-updater-notify
          systemd-analyze verify systemd/*.service systemd/*.timer systemd/*.path

      - name: Build source archive and checksum
        shell: bash
        run: |
          set -euo pipefail
          archive="ultimate-updater-notify-${RELEASE_TAG}.tar.gz"
          git archive --format=tar.gz --prefix="ultimate-updater-notify-${RELEASE_TAG}/" -o "$archive" "${EXPECTED_SHA}"
          sha256sum "$archive" > SHA256SUMS

      - name: Attest source archive
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: "ultimate-updater-notify-${{ env.RELEASE_TAG }}.tar.gz"

      - name: Prepare provenance bundle
        env:
          ATTESTATION_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        shell: bash
        run: |
          set -euo pipefail
          test -s "${ATTESTATION_BUNDLE}"
          cp "${ATTESTATION_BUNDLE}" "ultimate-updater-notify-${RELEASE_TAG}.sigstore.json"

      - name: Create or reuse draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            test "$(gh release view "${RELEASE_TAG}" --json isDraft --jq '.isDraft')" = "true" || {
              echo "error: ${RELEASE_TAG} already exists and is published; refusing to mutate an immutable release" >&2
              exit 1
            }
            echo "Reusing existing draft release ${RELEASE_TAG}"
          else
            gh release create "${RELEASE_TAG}" --draft --verify-tag --title "Ultimate Updater Notify ${RELEASE_TAG}" --generate-notes
          fi

      - name: Attach release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${RELEASE_TAG}" "ultimate-updater-notify-${RELEASE_TAG}.tar.gz" SHA256SUMS "ultimate-updater-notify-${RELEASE_TAG}.sigstore.json" --clobber

      - name: Publish immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${RELEASE_TAG}" --draft=false
